<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https://ui-avatars.com; connect-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USAME - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --sidebar-width: 280px;
            --bg-color: #f3f4f6;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1f2937;
            --text-muted: #6b7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg-color); color: var(--text-dark); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
        }
        .sidebar-brand { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 15px; margin-bottom: 40px; letter-spacing: 1px; }
        .sidebar-brand i { font-size: 28px; color: #a5b4fc; }
        .nav-item {
            padding: 15px 20px; border-radius: 12px; display: flex; align-items: center; gap: 15px;
            color: #c7d2fe; text-decoration: none; font-weight: 500; transition: all 0.3s ease; margin-bottom: 10px; cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.15); color: white; transform: translateX(5px); }
        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-logout { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: 600; }
        .btn-logout:hover { background: #ef4444; color: white; }

        /* Main Content */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px 50px;
            background: #f8fafc;
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; font-weight: 700; color: #1e293b; }
        .user-profile { display: flex; align-items: center; gap: 15px; background: white; padding: 8px 20px; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 40px; }
        .stat-card {
            background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.5); backdrop-filter: blur(10px); transition: transform 0.3s ease;
            position: relative; overflow: hidden;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-icon { position: absolute; right: -15px; top: -15px; font-size: 100px; opacity: 0.05; color: var(--primary); }
        .stat-value { font-size: 36px; font-weight: 700; color: var(--primary); margin-bottom: 5px; }
        .stat-label { color: var(--text-muted); font-weight: 500; font-size: 15px; }

        /* Table Area */
        .table-container {
            background: white; border-radius: 20px; padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .table-header h2 { font-size: 22px; color: #1e293b; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { padding: 15px 20px; text-align: left; color: #64748b; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #f1f5f9; }
        td { padding: 18px 20px; background: #f8fafc; }
        tr td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; font-weight: 600; color: #0f172a; }
        tr td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }
        tr { transition: transform 0.2s; }
        tr:hover td { background: #f1f5f9; transform: scale(1.01); }

        .status-badge { padding: 6px 14px; border-radius: 50px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .status-submitted { background: #e0e7ff; color: #3730a3; }
        .status-override { background: #fef08a; color: #854d0e; }
        .status-approved { background: #dcfce7; color: #166534; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        
        .action-btn { padding: 8px 18px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: background 0.3s; }
        .action-btn:hover { background: var(--primary-dark); }

        /* Modal Redesign */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); z-index: 1000; }
        .modal-content { background: white; width: 95%; max-width: 1300px; margin: 30px auto; padding: 0; border-radius: 20px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.25); display: flex; flex-direction: column; height: 90vh; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header { padding: 20px 30px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 22px; color: #0f172a; }
        .close { cursor: pointer; font-size: 28px; color: #64748b; transition: color 0.2s; }
        .close:hover { color: #ef4444; }
        
        .modal-body-container { display: flex; flex: 1; overflow: hidden; }
        
        .modal-info-panel { 
            flex: 1; padding: 30px; background: white; border-right: 1px solid #e2e8f0; max-width: 400px;
            display: flex; flex-direction: column;
        }
        #modalBody { flex: 1; overflow-y: auto; padding-right: 10px; }
        
        .modal-pdf-panel { flex: 2; background: #cbd5e1; padding: 0; display: flex; flex-direction: column; }
        .modal-pdf-panel iframe { flex: 1; width: 100%; border: none; }
        
        .info-group { margin-bottom: 25px; }
        .info-group label { display: block; font-size: 13px; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
        .info-group p { font-size: 16px; color: #0f172a; font-weight: 500; }
        
        .decision-box { background: #f8fafc; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; margin-top: 20px; flex-shrink: 0; }
        .decision-box h4 { margin-bottom: 15px; color: #0f172a; font-size: 18px; }
        .decision-box textarea { width: 100%; padding: 15px; border: 1px solid #cbd5e1; border-radius: 12px; font-family: inherit; resize: vertical; margin-bottom: 15px; transition: border-color 0.3s; }
        .decision-box textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .btn-approve { background: #10b981; color: white; padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.3s; flex: 1; }
        .btn-approve:hover { background: #059669; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-reject { background: #ef4444; color: white; padding: 12px 24px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 15px; transition: all 0.3s; flex: 1; }
        .btn-reject:hover { background: #dc2626; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }

        .toast { position: fixed; bottom: 30px; right: 30px; padding: 15px 25px; border-radius: 10px; color: white; font-weight: 500; transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 2000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }

        /* Responsive Design */
        @media (max-width: 992px) {
            body { flex-direction: column; }
            .sidebar { position: relative; width: 100%; height: auto; padding: 15px 20px; flex-direction: row; justify-content: space-between; align-items: center; z-index: 100; }
            .sidebar-brand { margin-bottom: 0; }
            .nav-item { display: none; }
            .sidebar-footer { margin-top: 0; padding-top: 0; border: none; }
            .btn-logout { width: auto; padding: 8px 15px; }
            .main-content { margin-left: 0; padding: 20px; }
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .stats-grid { grid-template-columns: 1fr; }
            .table-container { padding: 20px 15px; }
            .modal-content { height: 90vh; width: 95%; flex-direction: column; overflow-y: auto; }
            .modal-body-container { flex-direction: column; overflow: visible; }
            .modal-info-panel { max-width: 100%; border-right: none; border-bottom: 1px solid #e2e8f0; }
            .modal-pdf-panel { min-height: 500px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-shield-halved"></i> USAME
        </div>
        <div class="nav-item active">
            <i class="fa-solid fa-inbox"></i> Applications
        </div>
        <div class="sidebar-footer">
            <button id="btnLogout" class="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out</button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div>
                <h1>Admin Command Center</h1>
                <p style="color: var(--text-muted); margin-top: 5px;">Manage and review institution applications</p>
            </div>
            <div class="user-profile">
                <span id="adminName" style="font-weight: 600; color: #333;">Admin User</span>
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=4f46e5&color=fff" alt="Admin">
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fa-solid fa-file-lines stat-icon"></i>
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">Total Applications</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-clock stat-icon" style="color: #eab308;"></i>
                <div class="stat-value" id="stat-pending" style="color: #eab308;">-</div>
                <div class="stat-label">Pending Review</div>
            </div>
            <div class="stat-card">
                <i class="fa-solid fa-check-circle stat-icon" style="color: #10b981;"></i>
                <div class="stat-value" id="stat-approved" style="color: #10b981;">-</div>
                <div class="stat-label">Approved</div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Application Queue</h2>
                <div style="position: relative;">
                    <i class="fa-solid fa-search" style="position: absolute; left: 15px; top: 12px; color: #94a3b8;"></i>
                    <input type="text" placeholder="Search ID or Name..." style="padding: 10px 15px 10px 40px; border: 1px solid #e2e8f0; border-radius: 50px; outline: none; width: 250px;">
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Reg. ID</th>
                            <th>Institution Name</th>
                            <th>Date Submitted</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="appTableBody">
                        <tr><td colspan="5" style="text-align: center; padding: 40px; color: #94a3b8;">Loading queue...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-file-contract" style="color: var(--primary); margin-right: 10px;"></i> Application Review</h3>
                <span class="close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></span>
            </div>
            <div class="modal-body-container">
                <div class="modal-info-panel">
                    <div id="modalBody">
                        <!-- Details injected here -->
                    </div>
                    <div class="decision-box">
                        <h4><i class="fa-solid fa-gavel" style="color: #64748b; margin-right: 8px;"></i> Record Decision</h4>
                        <textarea id="decisionRemarks" rows="4" placeholder="Enter mandatory remarks for the applicant here... This will be sent via SMS!"></textarea>
                        <div style="display: flex; gap: 15px;" id="decisionButtonsContainer">
                            <button class="btn-approve decision-trigger" data-decision="approved"><i class="fa-solid fa-check"></i> Approve</button>
                            <button class="btn-reject decision-trigger" data-decision="rejected"><i class="fa-solid fa-xmark"></i> Reject</button>
                        </div>
                    </div>
                </div>
                <div class="modal-pdf-panel">
                    <iframe id="pdfFrame" title="Application PDF"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/admin.js"></script>
</body>
</html>

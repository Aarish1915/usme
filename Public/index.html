
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USAME Portal | Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="brand">
            <div>
                <h1>USAME Authority</h1>
                <p>Uttarakhand State Minority Education</p>
            </div>
        </div>
    </header>

    <main>
        <div class="glass-card auth-container">
            <div class="tabs">
                <div class="tab active" id="tab-login">Applicant Login</div>
                <div class="tab" id="tab-admin">Admin Login</div>
                <div class="tab" id="tab-register">Register</div>
            </div>

            <!-- LOGIN FORM -->
            <form id="form-login">
                <h2>Welcome Back</h2>
                
                <div class="login-options" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <label><input type="radio" name="login_mode" value="password" checked> Password</label>
                    <label><input type="radio" name="login_mode" value="otp"> OTP</label>
                </div>

                <!-- Password Mode -->
                <div id="login-password-mode">
                    <div class="form-group">
                        <label>Registration ID or Mobile</label>
                        <input type="text" id="login_identifier" placeholder="USAME-XXXXX or Mobile">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login_password" placeholder="Enter Password">
                    </div>
                    <button type="submit" class="btn" id="btn-login-submit">Login Securely</button>
                    <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                        <button type="button" class="link-btn" id="btn-forgot-password">Forgot Password?</button>
                        <button type="button" class="link-btn" id="btn-forgot-reg-id">Forgot Reg ID?</button>
                    </div>
                </div>

                <!-- OTP Mode -->
                <div id="login-otp-mode" class="hidden">
                    <div id="login-otp-step1">
                        <div class="form-group">
                            <label>Mobile Number</label>
                            <input type="text" id="login_mobile" placeholder="10-digit Mobile Number">
                        </div>
                        <button type="button" class="btn" id="btn-login-send-otp">Send OTP</button>
                    </div>
                    <div id="login-otp-step2" class="hidden">
                        <div class="form-group">
                            <label>Enter 4-Digit OTP</label>
                            <input type="number" id="login_otp" placeholder="XXXX">
                        </div>
                        <button type="button" class="btn" id="btn-login-verify-otp">Verify & Login</button>
                        <button type="button" class="btn btn-secondary" style="margin-top: 10px;" id="btn-login-back">Back</button>
                    </div>
                </div>
            </form>

            <!-- ADMIN LOGIN FORM -->
            <form id="form-admin" class="hidden">
                <h2>Admin Access</h2>
                <div class="form-group">
                    <label>Admin Mobile Number</label>
                    <input type="text" id="admin_mobile" placeholder="Registered Admin Mobile">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin_password" placeholder="Enter Password">
                </div>
                <button type="submit" class="btn" id="btn-admin-submit">Access Admin Portal</button>
            </form>

            <!-- FORGOT PASSWORD FORM -->
            <form id="form-forgot-password" class="hidden">
                <h2>Reset Password</h2>
                <div id="fp-step1">
                    <div class="form-group">
                        <label>Registered Mobile Number</label>
                        <input type="text" id="fp_mobile" placeholder="Enter Mobile Number">
                    </div>
                    <button type="button" class="btn" id="btn-fp-send">Send Reset OTP</button>
                    <button type="button" class="btn btn-secondary" style="margin-top: 10px;" onclick="switchTab('login')">Back to Login</button>
                </div>
                <div id="fp-step2" class="hidden">
                    <div class="form-group">
                        <label>Enter 4-Digit OTP</label>
                        <input type="number" id="fp_otp" placeholder="XXXX">
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="fp_new_password" placeholder="Min 6 characters">
                    </div>
                    <button type="button" class="btn" id="btn-fp-verify">Reset Password</button>
                    <button type="button" class="btn btn-secondary" style="margin-top: 10px;" id="btn-fp-back">Back</button>
                </div>
            </form>

            <!-- FORGOT REGISTRATION ID FORM -->
            <form id="form-forgot-reg-id" class="hidden">
                <h2>Recover Registration ID</h2>
                <div id="frid-step1">
                    <div class="form-group">
                        <label>Registered Mobile Number</label>
                        <input type="text" id="frid_mobile" placeholder="Enter Mobile Number">
                    </div>
                    <button type="button" class="btn" id="btn-frid-send">Send Recovery OTP</button>
                    <button type="button" class="btn btn-secondary" style="margin-top: 10px;" onclick="switchTab('login')">Back to Login</button>
                </div>
                <div id="frid-step2" class="hidden">
                    <div class="form-group">
                        <label>Enter 4-Digit OTP</label>
                        <input type="number" id="frid_otp" placeholder="XXXX">
                    </div>
                    <button type="button" class="btn" id="btn-frid-verify">Recover ID</button>
                    <button type="button" class="btn btn-secondary" style="margin-top: 10px;" id="btn-frid-back">Back</button>
                </div>
                <div id="frid-result" class="hidden" style="text-align: center;">
                    <p>Your Registration ID is:</p>
                    <h3 id="frid_display" style="margin: 10px 0; color: #4f46e5;">USAME-XXXXX</h3>
                    <button type="button" class="btn" onclick="switchTab('login')">Go to Login</button>
                </div>
            </form>

            <!-- REGISTER FORM -->
            <form id="form-register" class="hidden">
                <h2>Create Account</h2>
                <div id="reg-step1">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="reg_name" required placeholder="Manager / Applicant Name">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="number" id="reg_mobile" required placeholder="10-digit Mobile Number">
                    </div>
                    <div class="form-group">
                        <label>Create Password</label>
                        <input type="password" id="reg_password" required placeholder="Minimum 6 characters">
                    </div>
                    <div class="form-group">
                        <label>Institution Name</label>
                        <input type="text" id="reg_institution_name" required placeholder="e.g. Alpine Minority School">
                    </div>
                    <div class="form-group">
                        <label>Full Correspondence Address</label>
                        <input type="text" id="reg_address" required placeholder="e.g. Village Road, Laksar, Haridwar...">
                    </div>
                    <div class="form-group">
                        <label>Year of Establishment</label>
                        <input type="number" id="reg_established_year" required placeholder="YYYY">
                    </div>
                    <button type="submit" class="btn" id="btn-reg-otp">Send OTP</button>
                </div>
                
                <div id="reg-step2" class="hidden">
                    <div class="form-group">
                        <label>Enter 4-Digit OTP</label>
                        <p style="font-size: 0.8rem; color: #6b7280; margin-bottom: 10px;">Check your terminal console for the mock OTP!</p>
                        <input type="number" id="reg_otp" placeholder="XXXX">
                    </div>
                    <button type="button" class="btn" id="btn-reg-verify">Verify & Register</button>
                    <button type="button" class="btn btn-secondary" style="margin-top: 10px;" id="btn-reg-back">Back</button>
                </div>
            </form>
        </div>
    </main>

    <div id="toast" class="toast">Message here</div>

    <script src="js/auth.js"></script>
</body>
</html>
